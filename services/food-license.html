<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <title>ขออนุญาตอาหาร | OSSC นครปฐม</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <style>
    :root{
      --deep:#083f3b;
      --teal:#0a8f84;
      --paper:#f6f9f8;
      --text:#173e3a;
      --muted:#71837f;
      --line:#dce8e5;
      --shadow:0 14px 32px rgba(18,63,58,.09);
    }

    *{
      box-sizing:border-box;
    }

    body{
      margin:0;
      background:var(--paper);
      color:var(--text);
      font-family:"Sarabun",Tahoma,sans-serif;
    }

    img{
      max-width:100%;
      display:block;
    }

    .container{
      width:min(1240px,calc(100% - 40px));
      margin:auto;
    }

    /* =========================
       HEADER
    ========================= */

    .main-header{
      position:sticky;
      top:0;
      z-index:50;
      background:rgba(255,255,255,.97);
      border-bottom:1px solid var(--line);
      backdrop-filter:blur(14px);
    }

    .nav-wrap{
      min-height:110px;
      display:flex;
      align-items:center;
      gap:24px;
      padding:0 30px;
      width:100%;
    }

    .brand{
      margin-right:auto;
      display:flex;
      align-items:center;
      text-decoration:none;
    }

    .site-logo{
      width:420px;
      height:auto;
    }

    .nav-links{
      display:flex;
      align-items:center;
      gap:8px;
    }

    .nav-links a{
      color:#315b57;
      text-decoration:none;
      font-weight:700;
      padding:11px 14px;
      border-radius:12px;
    }

    .nav-links a:hover{
      background:#eef7f5;
      color:var(--deep);
    }

    .staff-link{
      background:var(--deep);
      color:#fff!important;
      padding-inline:18px!important;
    }

    /* =========================
       BANNER
    ========================= */

    .food-hero img{
      width:100%;
      aspect-ratio:1907/475;
      object-fit:cover;
    }

    /* =========================
       PAGE TITLE
    ========================= */

    .page-head{
      background:#fff;
      border-bottom:1px solid var(--line);
    }

    .page-head .container{
      padding:28px 0 24px;
    }

    .breadcrumb{
      color:#859590;
      font-size:.9rem;
      margin-bottom:12px;
    }

    .breadcrumb a{
      color:#5e7772;
      text-decoration:none;
    }

    .page-title h1{
      margin:0;
      color:#123f3c;
      font-size:clamp(2rem,4vw,3rem);
    }

    /* =========================
       CONTENT
    ========================= */

    .content{
      padding:28px 0 64px;
    }

    .search{
      position:relative;
      width:min(520px,100%);
      margin-bottom:22px;
      display:block;
    }

    .search span{
      position:absolute;
      left:15px;
      top:12px;
      opacity:.62;
    }

    .search input{
      width:100%;
      height:48px;
      border:1px solid var(--line);
      border-radius:14px;
      background:#fff;
      padding:0 16px 0 43px;
      outline:0;
      font-family:inherit;
    }

    .search input:focus{
      border-color:var(--teal);
      box-shadow:0 0 0 3px rgba(10,143,132,.10);
    }

    /* =========================
       TOPIC GRID
    ========================= */

    .topic-grid{
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:16px;
    }

    .topic-card{
      --accent:#e9defe;

      position:relative;
      min-height:225px;
      background:#fff;
      border:1px solid #e1e9e7;
      border-radius:18px;
      padding:17px;
      overflow:hidden;

      box-shadow:0 5px 18px rgba(20,60,55,.045);

      transition:
        transform .22s ease,
        box-shadow .22s ease,
        border-color .22s ease;

      display:flex;
      flex-direction:column;

      text-decoration:none;
      color:inherit;
      cursor:pointer;
    }

    .topic-card::before{
      content:"";
      position:absolute;
      top:0;
      left:0;
      right:0;
      height:5px;
      background:var(--accent);
    }

    .topic-card:hover{
      transform:translateY(-5px);
      box-shadow:0 15px 32px rgba(18,63,58,.12);
      border-color:#badbd6;
    }

    /* ลบไอคอนขวา เหลือหมายเลขอย่างเดียว */
    .topic-top{
      display:flex;
      align-items:center;
      justify-content:flex-start;
    }

    .topic-no{
      width:38px;
      height:38px;
      border-radius:50%;
      display:grid;
      place-items:center;

      font-weight:800;
      font-size:.95rem;

      background:var(--accent);
      color:#654f72;
    }

    .topic-card h2{
      margin:15px 0 8px;
      font-size:1.03rem;
      line-height:1.5;
      color:#193d39;
      font-weight:800;
    }

    /* คำอธิบายให้อ่านง่ายและเด่นขึ้น */
    .topic-card p{
      margin:0;
      color:#5f7672;
      font-size:.92rem;
      line-height:1.65;
      font-weight:500;
    }

    /* =========================
       ปุ่มดูรายละเอียด
    ========================= */

    .topic-action{
      margin-top:auto;
      padding-top:18px;
    }

    .topic-action-inner{
      min-height:44px;

      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;

      padding:8px 9px 8px 14px;

      background:#e8f7f4;
      border:1px solid #cceae5;
      border-radius:12px;

      color:#087c72;
      font-size:.93rem;
      font-weight:800;

      transition:
        background .2s ease,
        color .2s ease,
        transform .2s ease;
    }

    .topic-arrow{
      width:30px;
      height:30px;
      min-width:30px;

      display:grid;
      place-items:center;

      border-radius:50%;
      background:var(--teal);
      color:#fff;

      font-size:1.15rem;
      line-height:1;

      transition:transform .2s ease;
    }

    .topic-card:hover .topic-action-inner{
      background:var(--teal);
      color:#fff;
    }

    .topic-card:hover .topic-arrow{
      background:#fff;
      color:var(--teal);
      transform:translateX(3px);
    }

    /* =========================
       FOOTER
    ========================= */

    .simple-footer{
      border-top:1px solid var(--line);
      background:#f6faf9;
    }

    .simple-footer .container{
      min-height:66px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:20px;
      color:#66807c;
      font-size:.88rem;
    }

    .simple-footer a{
      color:var(--deep);
      font-weight:700;
      text-decoration:none;
    }

    /* =========================
       RESPONSIVE
    ========================= */

    @media(max-width:1000px){
      .site-logo{
        width:330px;
      }

      .nav-wrap{
        min-height:92px;
        padding:0 20px;
      }

      .topic-grid{
        grid-template-columns:repeat(3,1fr);
      }
    }

    @media(max-width:760px){
      .container{
        width:min(100% - 28px,1240px);
      }

      .site-logo{
        width:270px;
      }

      .nav-wrap{
        min-height:82px;
        padding:0 14px;
      }

      .nav-links a:not(.staff-link){
        display:none;
      }

      .topic-grid{
        grid-template-columns:repeat(2,1fr);
      }

      .food-hero img{
        aspect-ratio:1.85/1;
      }
    }

    @media(max-width:480px){
      .site-logo{
        width:220px;
      }

      .staff-link{
        font-size:.85rem;
        padding:9px 10px!important;
      }

      .topic-grid{
        grid-template-columns:1fr;
      }
    }
  </style>
</head>

<body>

<header class="main-header">
  <div class="nav-wrap">

    <a class="brand" href="../">
      <img
        src="../assets/LogoOSSC.png"
        alt="OSSC นครปฐม"
        class="site-logo"
      >
    </a>

    <nav class="nav-links">
      <a href="../">หน้าหลัก</a>

      <a
        href="https://maps.app.goo.gl/sVRwbfAZX14rP1Zf7?g_st=il"
        target="_blank"
        rel="noopener"
      >
        ติดต่อเรา
      </a>

      <a class="staff-link" href="../">
        สำหรับเจ้าหน้าที่
      </a>
    </nav>

  </div>
</header>

<section class="food-hero">
  <img
    src="../assets/banners/food.gif"
    alt="ขออนุญาตอาหาร"
  >
</section>

<section class="page-head">
  <div class="container">

    <div class="breadcrumb">
      <a href="../">หน้าหลัก</a>
      › ศูนย์บริการ
      › ขออนุญาตอาหาร
    </div>

    <div class="page-title">
      <h1>ขออนุญาตอาหาร</h1>
    </div>

  </div>
</section>

<main class="content">
  <div class="container">

    <label class="search">
      <span>🔎</span>

      <input
        id="searchInput"
        type="search"
        placeholder="ค้นหาหัวข้อ เช่น GMP, Checklist, ฉลาก, e-submission"
      >
    </label>

    <div
      class="topic-grid"
      id="topicGrid"
    ></div>

  </div>
</main>

<footer class="simple-footer">
  <div class="container">
    <span>สำนักงานสาธารณสุขจังหวัดนครปฐม</span>

    <a href="https://fda73.moph.go.th">
      fda73.moph.go.th
    </a>
  </div>
</footer>

<script>

const topics = [
  [
    "01",
    "คู่มือสำหรับประชาชนด้านอาหาร",
    "คู่มือ ขั้นตอน และข้อมูลที่เกี่ยวข้องกับการขออนุญาตด้านอาหาร",
    "#f8d8ef"
  ],

  [
    "02",
    "รายการเอกสารยื่นขออนุญาตด้านอาหาร (Checklist)",
    "ตรวจสอบรายการเอกสารที่ต้องใช้ก่อนยื่นคำขอ",
    "#e9defe"
  ],

  [
    "03",
    "แบบฟอร์มขออนุญาต / ขอสิทธิ์ใช้ e-submission / มอบอำนาจ",
    "รวมแบบฟอร์มและเอกสารที่เกี่ยวข้อง",
    "#dceeff"
  ],

  [
    "04",
    "คู่มือการใช้งานระบบ e-submission / ระบบเลขเสมือน / E-consult",
    "คู่มือและระบบออนไลน์ที่เกี่ยวข้องสำหรับผู้ประกอบการ",
    "#ddf3e7"
  ],

  [
    "05",
    "GMP มาตรฐานสถานที่ผลิตอาหาร",
    "หลักเกณฑ์ มาตรฐาน และข้อมูลสำหรับสถานที่ผลิตอาหาร",
    "#fff0c9"
  ],

  [
    "06",
    "หน่วยตรวจ / หน่วยรับรอง / ห้องปฏิบัติการ",
    "ข้อมูลหน่วยงานตรวจ วิเคราะห์ รับรอง และหน่วยฝึกอบรม",
    "#f8d8ef"
  ],

  [
    "07",
    "กลุ่มอาหารและประเภทอาหาร / Codex / กรรมวิธีการผลิต",
    "ข้อมูลประเภทอาหาร กรรมวิธีการผลิต และภาชนะบรรจุ",
    "#e9defe"
  ],

  [
    "08",
    "วัตถุเจือปนอาหาร / ส่วนประกอบที่อนุญาตและไม่อนุญาต",
    "ข้อมูลส่วนประกอบ วัตถุเจือปน และหลักเกณฑ์ที่เกี่ยวข้อง",
    "#dceeff"
  ],

  [
    "09",
    "ฝึกอบรม / ประชาสัมพันธ์",
    "กิจกรรม ข่าวสาร และข้อมูลการอบรมที่เกี่ยวข้อง",
    "#ddf3e7"
  ],

  [
    "10",
    "ฉลาก / กฎหมายอาหาร",
    "ข้อกำหนดเกี่ยวกับฉลากและกฎหมายอาหาร",
    "#fff0c9"
  ],

  [
    "11",
    "ระบบเลขเสมือน (FM,FG)",
    "ระบบและข้อมูลสำหรับการใช้งานเลขเสมือน",
    "#f8d8ef"
  ],

  [
    "12",
    "กองอาหาร สำนักงานคณะกรรมการอาหารและยา",
    "เชื่อมต่อข้อมูลและบริการจากกองอาหาร อย.",
    "#e9defe"
  ]
];

const grid = document.getElementById("topicGrid");
const searchInput = document.getElementById("searchInput");

function render(q=""){

  const text = q.trim().toLowerCase();

  const visible = topics.filter(t =>
    (t[1] + " " + t[2])
      .toLowerCase()
      .includes(text)
  );

  grid.innerHTML = visible.map(t => `
    <a
      class="topic-card"
      href="#"
      style="--accent:${t[3]}"
    >

      <div class="topic-top">
        <span class="topic-no">${t[0]}</span>
      </div>

      <h2>${t[1]}</h2>

      <p>${t[2]}</p>

      <div class="topic-action">
        <div class="topic-action-inner">

          <span>ดูรายละเอียด</span>

          <span class="topic-arrow">
            →
          </span>

        </div>
      </div>

    </a>
  `).join("");
}

searchInput.addEventListener(
  "input",
  e => render(e.target.value)
);

render();

</script>

</body>
</html>
