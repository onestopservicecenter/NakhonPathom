<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ขออนุญาตอาหาร | OSSC นครปฐม</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{
      --deep:#0b514b;
      --teal:#0a8f84;
      --teal-soft:#effaf8;
      --paper:#f5f8f8;
      --text:#173f3b;
      --muted:#728681;
      --line:#dfe9e6;
      --white:#fff;
      --shadow:0 12px 28px rgba(20,70,64,.08);
      --pink:#f8d8ef;
      --purple:#e8ddff;
      --blue:#dceeff;
      --green:#dff4e8;
      --yellow:#fff0c9;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      background:var(--paper);
      color:var(--text);
      font-family:"Sarabun",Tahoma,sans-serif;
    }
    button,input,textarea,select{font:inherit}
    button{cursor:pointer}
    .topbar{
      position:sticky;
      top:0;
      z-index:20;
      background:rgba(255,255,255,.96);
      backdrop-filter:blur(12px);
      border-bottom:1px solid var(--line);
    }
    .topbar-inner{
      width:min(1180px,calc(100% - 32px));
      margin:auto;
      min-height:72px;
      display:flex;
      align-items:center;
      gap:18px;
    }
    .brand{
      font-weight:800;
      color:var(--deep);
      text-decoration:none;
      margin-right:auto;
    }
    .top-action{
      border:0;
      border-radius:12px;
      padding:10px 14px;
      font-weight:700;
    }
    .top-action.admin{
      background:var(--deep);
      color:#fff;
    }
    .container{
      width:min(1180px,calc(100% - 32px));
      margin:auto;
    }
    .hero{
      padding:34px 0 20px;
    }
    .breadcrumb{
      color:#83948f;
      font-size:.9rem;
      margin-bottom:12px;
    }
    .hero h1{
      margin:0;
      font-size:clamp(2rem,4vw,3.2rem);
      color:#123f3b;
    }
    .hero p{
      color:var(--muted);
      margin:10px 0 0;
      max-width:760px;
      line-height:1.7;
    }
    .toolbar{
      display:flex;
      gap:12px;
      align-items:center;
      margin:22px 0 18px;
      flex-wrap:wrap;
    }
    .search{
      flex:1 1 320px;
      position:relative;
    }
    .search input{
      width:100%;
      height:48px;
      border:1px solid var(--line);
      background:#fff;
      border-radius:14px;
      padding:0 14px 0 42px;
      outline:0;
    }
    .search span{
      position:absolute;
      left:14px;
      top:12px;
      opacity:.6;
    }
    .add-btn{
      border:0;
      background:var(--teal);
      color:#fff;
      height:48px;
      padding:0 16px;
      border-radius:14px;
      font-weight:800;
      display:none;
    }
    .admin-mode .add-btn{display:block}
    .grid{
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:16px;
      padding-bottom:50px;
    }
    .card{
      position:relative;
      background:#fff;
      border:1px solid var(--line);
      border-radius:18px;
      padding:16px;
      min-height:205px;
      box-shadow:0 4px 16px rgba(26,67,62,.04);
      transition:.2s ease;
      overflow:hidden;
    }
    .card::before{
      content:"";
      position:absolute;
      left:0;right:0;top:0;
      height:5px;
      background:var(--accent,var(--purple));
    }
    .card:hover{
      transform:translateY(-4px);
      box-shadow:var(--shadow);
    }
    .card-head{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:10px;
    }
    .num{
      width:34px;
      height:34px;
      border-radius:50%;
      display:grid;
      place-items:center;
      font-weight:800;
      background:var(--accent,var(--purple));
      color:#704d88;
    }
    .badge{
      font-size:.78rem;
      padding:6px 9px;
      border-radius:999px;
      background:#f3f5f4;
      color:#7b8986;
      font-weight:700;
    }
    .card h3{
      font-size:1rem;
      line-height:1.5;
      margin:14px 0 8px;
      color:#253f3c;
    }
    .card p{
      margin:0;
      color:var(--muted);
      line-height:1.6;
      font-size:.9rem;
    }
    .card-footer{
      margin-top:14px;
      display:flex;
      gap:8px;
      flex-wrap:wrap;
    }
    .btn{
      border:1px solid #cfe1dd;
      background:#f3faf8;
      color:#17685f;
      border-radius:10px;
      padding:8px 10px;
      text-decoration:none;
      font-weight:700;
      font-size:.86rem;
    }
    .btn.web{background:#f3f7ff;color:#3c5d9e;border-color:#d8e2f4}
    .admin-tools{
      display:none;
      margin-top:12px;
      padding-top:10px;
      border-top:1px dashed var(--line);
      gap:8px;
    }
    .admin-mode .admin-tools{display:flex}
    .mini{
      border:0;
      border-radius:9px;
      padding:7px 9px;
      font-weight:700;
    }
    .edit{background:#fff4d8;color:#9b6a00}
    .delete{background:#ffe8ec;color:#b43f54}
    .empty{
      grid-column:1/-1;
      text-align:center;
      padding:48px;
      color:var(--muted);
      background:#fff;
      border:1px dashed var(--line);
      border-radius:18px;
    }
    dialog{
      width:min(560px,calc(100% - 28px));
      border:0;
      border-radius:18px;
      padding:0;
      box-shadow:0 30px 80px rgba(0,0,0,.22);
    }
    dialog::backdrop{background:rgba(12,25,23,.45)}
    .modal-head{
      padding:18px 20px;
      border-bottom:1px solid var(--line);
      display:flex;
      align-items:center;
      justify-content:space-between;
    }
    .modal-head h2{margin:0;font-size:1.2rem}
    .close{
      border:0;
      background:transparent;
      font-size:1.4rem;
      color:#889793;
    }
    .form{
      padding:20px;
      display:grid;
      gap:14px;
    }
    label{
      display:grid;
      gap:7px;
      font-weight:700;
      color:#3c5652;
    }
    input,textarea,select{
      width:100%;
      border:1px solid #d4dfdc;
      border-radius:11px;
      padding:10px 12px;
      background:#fff;
      outline:0;
    }
    textarea{min-height:90px;resize:vertical}
    .two{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:12px;
    }
    .checkrow{
      display:flex;
      gap:14px;
      flex-wrap:wrap;
      font-weight:600;
    }
    .checkrow label{
      display:flex;
      align-items:center;
      gap:7px;
      font-weight:600;
    }
    .checkrow input{width:auto}
    .modal-actions{
      padding:16px 20px 20px;
      display:flex;
      justify-content:flex-end;
      gap:10px;
    }
    .cancel{
      border:1px solid #d7dfdd;
      background:#fff;
      color:#586d69;
      padding:10px 14px;
      border-radius:10px;
      font-weight:700;
    }
    .save{
      border:0;
      background:var(--teal);
      color:#fff;
      padding:10px 16px;
      border-radius:10px;
      font-weight:800;
    }
    .viewer{
      width:min(1100px,calc(100% - 28px));
    }
    .viewer iframe{
      width:100%;
      height:72vh;
      border:0;
      background:#f3f5f4;
    }
    @media(max-width:1000px){.grid{grid-template-columns:repeat(3,1fr)}}
    @media(max-width:760px){
      .grid{grid-template-columns:repeat(2,1fr)}
      .two{grid-template-columns:1fr}
    }
    @media(max-width:520px){
      .grid{grid-template-columns:1fr}
      .topbar-inner{min-height:64px}
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="#">OSSC นครปฐม</a>
      <button class="top-action admin" id="adminToggle">โหมด Admin</button>
    </div>
  </header>

  <main class="container">
    <section class="hero">
      <div class="breadcrumb">หน้าหลัก › ศูนย์บริการ › ขออนุญาตอาหาร</div>
      <h1>ขออนุญาตอาหาร</h1>
      <p>คู่มือ เอกสาร แบบฟอร์ม และระบบที่เกี่ยวข้องกับการขออนุญาตด้านอาหาร สำหรับประชาชนและผู้ประกอบการ</p>
    </section>

    <section class="toolbar">
      <div class="search">
        <span>🔎</span>
        <input id="searchInput" placeholder="ค้นหาหัวข้อหรือคำสำคัญ">
      </div>
      <button class="add-btn" id="addTopicBtn">+ เพิ่มหัวข้อ</button>
    </section>

    <section class="grid" id="topicGrid"></section>
  </main>

  <dialog id="editDialog">
    <form method="dialog" id="topicForm">
      <div class="modal-head">
        <h2 id="formTitle">เพิ่มหัวข้อ</h2>
        <button class="close" value="cancel" type="submit">×</button>
      </div>
      <div class="form">
        <div class="two">
          <label>ลำดับ
            <input id="orderInput" type="number" min="1" required>
          </label>
          <label>สถานะ
            <select id="visibilityInput">
              <option value="public">Public</option>
              <option value="staff">Staff</option>
            </select>
          </label>
        </div>

        <label>ชื่อหัวข้อ
          <input id="titleInput" required>
        </label>

        <label>คำอธิบาย
          <textarea id="descInput"></textarea>
        </label>

        <div class="checkrow">
          <label><input type="checkbox" id="pdfCheck"> มี PDF</label>
          <label><input type="checkbox" id="webCheck"> มีเว็บไซต์</label>
        </div>

        <label id="pdfField">Google Drive File ID
          <input id="pdfInput" placeholder="เช่น 1AbCdEf...">
        </label>

        <label id="webField">Website URL
          <input id="webInput" placeholder="https://...">
        </label>
      </div>
      <div class="modal-actions">
        <button class="cancel" value="cancel" type="submit">ยกเลิก</button>
        <button class="save" value="default" type="button" id="saveBtn">บันทึก</button>
      </div>
    </form>
  </dialog>

  <dialog class="viewer" id="pdfDialog">
    <div class="modal-head">
      <h2 id="pdfTitle">เอกสาร PDF</h2>
      <button class="close" type="button" id="closePdf">×</button>
    </div>
    <iframe id="pdfFrame" title="PDF Viewer"></iframe>
  </dialog>

  <script>
    const DEFAULT_TOPICS = [
      {id:1,order:1,title:"คู่มือสำหรับประชาชนด้านอาหาร",desc:"คู่มือ ขั้นตอน และข้อมูลสำหรับการขออนุญาตด้านอาหาร",visibility:"public",pdf:"",web:""},
      {id:2,order:2,title:"รายการเอกสารยื่นขออนุญาตด้านอาหาร (Checklist)",desc:"ตรวจสอบรายการเอกสารก่อนยื่นคำขอ",visibility:"public",pdf:"",web:""},
      {id:3,order:3,title:"แบบฟอร์มขออนุญาต / ขอสิทธิ์ใช้ e-submission / มอบอำนาจ",desc:"รวมแบบฟอร์มและเอกสารที่เกี่ยวข้อง",visibility:"public",pdf:"",web:""},
      {id:4,order:4,title:"คู่มือการใช้งานระบบ e-submission / ระบบเลขเสมือน / E-consult",desc:"คู่มือและระบบออนไลน์สำหรับผู้ประกอบการ",visibility:"public",pdf:"",web:""},
      {id:5,order:5,title:"GMP มาตรฐานสถานที่ผลิตอาหาร",desc:"หลักเกณฑ์และมาตรฐานสถานที่ผลิตอาหาร",visibility:"public",pdf:"",web:""},
      {id:6,order:6,title:"หน่วยตรวจ / หน่วยรับรอง / ห้องปฏิบัติการ",desc:"ข้อมูลหน่วยงานตรวจ วิเคราะห์ รับรอง และฝึกอบรม",visibility:"public",pdf:"",web:""},
      {id:7,order:7,title:"กลุ่มอาหารและประเภทอาหาร / Codex / กรรมวิธีการผลิต",desc:"ข้อมูลประเภทอาหารและหลักเกณฑ์ที่เกี่ยวข้อง",visibility:"public",pdf:"",web:""},
      {id:8,order:8,title:"วัตถุเจือปนอาหาร / ส่วนประกอบที่อนุญาตและไม่อนุญาต",desc:"ข้อมูลวัตถุเจือปนและส่วนประกอบอาหาร",visibility:"public",pdf:"",web:""},
      {id:9,order:9,title:"ฝึกอบรม / ประชาสัมพันธ์",desc:"ข่าวสาร กิจกรรม และการอบรม",visibility:"public",pdf:"",web:""},
      {id:10,order:10,title:"ฉลาก / กฎหมายอาหาร",desc:"ข้อกำหนดฉลากและกฎหมายที่เกี่ยวข้อง",visibility:"public",pdf:"",web:""},
      {id:11,order:11,title:"ระบบเลขเสมือน (FM,FG)",desc:"เข้าสู่ระบบเลขเสมือนสำหรับการดำเนินงาน",visibility:"public",pdf:"",web:""},
      {id:12,order:12,title:"กองอาหาร สำนักงานคณะกรรมการอาหารและยา",desc:"เชื่อมต่อข้อมูลจากกองอาหาร อย.",visibility:"public",pdf:"",web:""}
    ];

    let adminMode = false;
    let editId = null;
    let topics = JSON.parse(localStorage.getItem("foodTopics") || "null") || DEFAULT_TOPICS;

    const grid = document.getElementById("topicGrid");
    const searchInput = document.getElementById("searchInput");
    const adminToggle = document.getElementById("adminToggle");
    const addTopicBtn = document.getElementById("addTopicBtn");
    const editDialog = document.getElementById("editDialog");
    const formTitle = document.getElementById("formTitle");
    const orderInput = document.getElementById("orderInput");
    const visibilityInput = document.getElementById("visibilityInput");
    const titleInput = document.getElementById("titleInput");
    const descInput = document.getElementById("descInput");
    const pdfCheck = document.getElementById("pdfCheck");
    const webCheck = document.getElementById("webCheck");
    const pdfField = document.getElementById("pdfField");
    const webField = document.getElementById("webField");
    const pdfInput = document.getElementById("pdfInput");
    const webInput = document.getElementById("webInput");
    const saveBtn = document.getElementById("saveBtn");
    const pdfDialog = document.getElementById("pdfDialog");
    const pdfTitle = document.getElementById("pdfTitle");
    const pdfFrame = document.getElementById("pdfFrame");

    const accents = ["var(--pink)","var(--purple)","var(--blue)","var(--green)","var(--yellow)"];

    function saveTopics(){
      localStorage.setItem("foodTopics", JSON.stringify(topics));
    }

    function render(){
      document.body.classList.toggle("admin-mode", adminMode);
      const q = searchInput.value.trim().toLowerCase();

      const visible = topics
        .filter(t => adminMode || t.visibility === "public")
        .filter(t => !q || (t.title + " " + t.desc).toLowerCase().includes(q))
        .sort((a,b) => a.order - b.order);

      grid.innerHTML = visible.length ? visible.map((t,i) => `
        <article class="card" style="--accent:${accents[i % accents.length]}">
          <div class="card-head">
            <span class="num">${String(t.order).padStart(2,"0")}</span>
            <span class="badge">${t.visibility === "staff" ? "🔒 Staff" : "Public"}</span>
          </div>
          <h3>${escapeHtml(t.title)}</h3>
          <p>${escapeHtml(t.desc || "")}</p>

          <div class="card-footer">
            ${t.pdf ? `<button class="btn" onclick="openPdf(${t.id})">📄 ดู PDF</button>` : ""}
            ${t.web ? `<a class="btn web" href="${escapeAttr(t.web)}" target="_blank" rel="noopener">🌐 เว็บไซต์</a>` : ""}
            ${(!t.pdf && !t.web) ? `<button class="btn" onclick="openTopic(${t.id})">ดูรายละเอียด →</button>` : ""}
          </div>

          <div class="admin-tools">
            <button class="mini edit" onclick="editTopic(${t.id})">✏️ แก้ไข</button>
            <button class="mini delete" onclick="deleteTopic(${t.id})">🗑 ลบ</button>
          </div>
        </article>
      `).join("") : `<div class="empty">ไม่พบหัวข้อที่ค้นหา</div>`;
    }

    function openTopic(id){
      alert("ขั้นถัดไป: เชื่อมหน้า 'หัวข้อย่อย' สำหรับรายการ ID " + id);
    }

    function openPdf(id){
      const t = topics.find(x => x.id === id);
      if(!t || !t.pdf) return;
      pdfTitle.textContent = t.title;
      pdfFrame.src = `https://drive.google.com/file/d/${encodeURIComponent(t.pdf)}/preview`;
      pdfDialog.showModal();
    }

    function toggleFields(){
      pdfField.style.display = pdfCheck.checked ? "grid" : "none";
      webField.style.display = webCheck.checked ? "grid" : "none";
    }

    function newTopic(){
      editId = null;
      formTitle.textContent = "เพิ่มหัวข้อ";
      orderInput.value = topics.length ? Math.max(...topics.map(t=>t.order)) + 1 : 1;
      visibilityInput.value = "public";
      titleInput.value = "";
      descInput.value = "";
      pdfCheck.checked = false;
      webCheck.checked = false;
      pdfInput.value = "";
      webInput.value = "";
      toggleFields();
      editDialog.showModal();
    }

    function editTopic(id){
      const t = topics.find(x => x.id === id);
      if(!t) return;
      editId = id;
      formTitle.textContent = "แก้ไขหัวข้อ";
      orderInput.value = t.order;
      visibilityInput.value = t.visibility;
      titleInput.value = t.title;
      descInput.value = t.desc || "";
      pdfCheck.checked = !!t.pdf;
      webCheck.checked = !!t.web;
      pdfInput.value = t.pdf || "";
      webInput.value = t.web || "";
      toggleFields();
      editDialog.showModal();
    }

    function deleteTopic(id){
      if(!confirm("ลบหัวข้อนี้ใช่หรือไม่?")) return;
      topics = topics.filter(x => x.id !== id);
      saveTopics();
      render();
    }

    function saveTopic(){
      const title = titleInput.value.trim();
      if(!title) return alert("กรุณากรอกชื่อหัวข้อ");

      const item = {
        id: editId || Date.now(),
        order: Number(orderInput.value || 1),
        visibility: visibilityInput.value,
        title,
        desc: descInput.value.trim(),
        pdf: pdfCheck.checked ? pdfInput.value.trim() : "",
        web: webCheck.checked ? webInput.value.trim() : ""
      };

      if(editId){
        topics = topics.map(t => t.id === editId ? item : t);
      }else{
        topics.push(item);
      }
      saveTopics();
      editDialog.close();
      render();
    }

    function escapeHtml(str=""){
      return str.replace(/[&<>"']/g, c => ({
        "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
      }[c]));
    }

    function escapeAttr(str=""){
      return str.replace(/"/g,"&quot;");
    }

    adminToggle.addEventListener("click", () => {
      adminMode = !adminMode;
      adminToggle.textContent = adminMode ? "ออกจากโหมด Admin" : "โหมด Admin";
      render();
    });
    addTopicBtn.addEventListener("click", newTopic);
    searchInput.addEventListener("input", render);
    pdfCheck.addEventListener("change", toggleFields);
    webCheck.addEventListener("change", toggleFields);
    saveBtn.addEventListener("click", saveTopic);
    document.getElementById("closePdf").addEventListener("click", () => {
      pdfFrame.src = "";
      pdfDialog.close();
    });

    render();
  </script>
</body>
</html>
